<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>설문 결과 · MyNexus</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9fc; --card:#fff; --ink:#1a1830; --ink-2:#565270; --ink-3:#8b87a3;
  --line:#e8e5f0; --track:#eeecf5; --mark:#6C63FF; --soft:#f0efff;
  --warn:#b4531f; --warn-bg:#fdf1e8;
  --shadow:0 1px 2px rgba(26,24,48,.05),0 6px 20px rgba(26,24,48,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131120; --card:#1c1930; --ink:#f2f0fa; --ink-2:#b3aecb; --ink-3:#7c7796;
  --line:#2b2743; --track:#272242; --mark:#867eff; --soft:#241f45;
  --warn:#f0a875; --warn-bg:#2e2114;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#131120; --card:#1c1930; --ink:#f2f0fa; --ink-2:#b3aecb; --ink-3:#7c7796;
  --line:#2b2743; --track:#272242; --mark:#867eff; --soft:#241f45;
  --warn:#f0a875; --warn-bg:#2e2114;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Malgun Gothic",system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:26px 18px 60px}
h1{font-size:22px;letter-spacing:-.5px;margin:0 0 3px}
.sub{font-size:13px;color:var(--ink-3);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;margin-top:12px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 13px;letter-spacing:-.3px}
.card h2 .tag{font-size:11px;font-weight:700;background:var(--soft);color:var(--mark);padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:1px}

/* 히어로 */
.hero{text-align:center;padding:24px 16px}
.hero .n{font-size:52px;font-weight:700;line-height:1;letter-spacing:-2px}
.hero .l{font-size:13px;color:var(--ink-3);margin-top:7px}
.goal{margin-top:14px}
.goal .track{height:7px;background:var(--track);border-radius:99px;overflow:hidden}
.goal .fill{height:100%;background:var(--mark);border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.goal .cap{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-top:6px}

/* 지표 타일 */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.tile .v{font-size:27px;font-weight:700;letter-spacing:-1px;line-height:1.1}
.tile .k{font-size:12px;color:var(--ink-3);margin-top:4px;line-height:1.35}
.tile .d{font-size:11.5px;color:var(--ink-3);margin-top:2px}

/* 막대 */
.row{margin-bottom:9px}
.row:last-child{margin-bottom:0}
.rt{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-bottom:4px;gap:8px}
.rt .lb{color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt .vl{flex:none;color:var(--ink);font-weight:700;font-size:13px}
.rt .vl span{color:var(--ink-3);font-weight:500;margin-left:4px}
.bar{height:9px;background:var(--track);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--mark);border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* 기타 */
.cmp{display:flex;gap:10px}
.cmp>div{flex:1;background:var(--soft);border-radius:11px;padding:12px}
.cmp .p{font-size:22px;font-weight:700;letter-spacing:-.5px}
.cmp .t{font-size:11.5px;color:var(--ink-3);margin-top:3px;line-height:1.35}
.quote{border-left:3px solid var(--mark);padding:9px 0 9px 12px;margin-bottom:11px;font-size:14px;color:var(--ink-2)}
.quote:last-child{margin-bottom:0}
.quote .m{font-size:11.5px;color:var(--ink-3);margin-bottom:3px}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:11px;padding:12px 14px;font-size:13px;margin-top:12px;line-height:1.5}
pre{background:var(--soft);border-radius:11px;padding:13px;font-size:12.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;margin:0;color:var(--ink-2);font-family:inherit}
button{border:0;border-radius:11px;background:var(--mark);color:#fff;font:inherit;font-size:14.5px;font-weight:700;padding:11px 16px;cursor:pointer;font-family:inherit}
button.sec{background:transparent;color:var(--mark);border:1.5px solid var(--line)}
button:active{transform:scale(.99)}
.btns{display:flex;gap:8px;margin-top:11px}
.btns button{flex:1}
.gate{text-align:center;padding:80px 20px}
.gate h1{margin-bottom:8px}
.gate p{color:var(--ink-3);font-size:14px;margin:0 0 22px}
.gate button{max-width:280px;width:100%}
.empty{text-align:center;color:var(--ink-3);font-size:14px;padding:24px 0}
.live{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-3)}
.live i{width:6px;height:6px;border-radius:50%;background:#1f9d6b;display:block;animation:bl 2s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25}}
details summary{cursor:pointer;font-size:13.5px;color:var(--ink-2);font-weight:500}
details[open] summary{margin-bottom:10px}
.mails{font-size:12.5px;color:var(--ink-2);word-break:break-all;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">

  <div id="gate" class="gate">
    <h1>설문 결과</h1>
    <p>관리자만 열람할 수 있습니다.</p>
    <button id="loginBtn" type="button">Google 계정으로 로그인</button>
    <p id="gateMsg" style="margin-top:16px;color:#e05a6b"></p>
  </div>

  <div id="app" hidden>
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px">
      <div>
        <h1>설문 결과</h1>
        <p class="sub">MyNexus 고객검증 · 모두의창업 2차</p>
      </div>
      <span class="live"><i></i>실시간</span>
    </div>

    <div class="card hero">
      <div class="n" id="N">0</div>
      <div class="l">유효 응답</div>
      <div class="goal">
        <div class="track"><i class="fill" id="goalFill" style="width:0%"></i></div>
        <div class="cap"><span id="goalNow">0 / 20명</span><span>온라인 목표</span></div>
      </div>
    </div>

    <div class="tiles" id="tiles"></div>
    <div id="dupWarn"></div>
    <div id="charts"></div>

    <div class="card">
      <h2>직군 편향 검증 <span class="tag">심사 대응</span></h2>
      <div class="cmp" id="cmp"></div>
      <p class="sub" style="margin-top:10px">두 값이 비슷할수록 "특정 직군만의 문제가 아니다"는 근거가 강해집니다.</p>
    </div>

    <div class="card" id="quotesCard" hidden>
      <h2>부정·유보 의견 <span class="tag">인용용</span></h2>
      <div id="quotes"></div>
    </div>

    <div class="card">
      <h2>신청서에 넣을 문장</h2>
      <pre id="sentence"></pre>
      <div class="btns">
        <button id="copyBtn" type="button">문장 복사</button>
        <button id="csvBtn" type="button" class="sec">CSV 내려받기</button>
      </div>
    </div>

    <div class="card" id="mailCard" hidden>
      <details>
        <summary id="mailSum">출시 알림 신청 이메일</summary>
        <div class="mails" id="mails"></div>
        <div class="btns"><button id="mailCopy" type="button" class="sec">이메일 전체 복사</button></div>
      </details>
    </div>

    <p class="sub" style="text-align:center;margin-top:20px">
      <span id="who"></span> · <a href="#" id="logout" style="color:var(--ink-3)">로그아웃</a>
    </p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyAv5Kvph7fnPHK3rH_oaSSTC8h2F5Yp7Is",
  authDomain: "my-nexus-hub.firebaseapp.com",
  projectId: "my-nexus-hub",
  storageBucket: "my-nexus-hub.firebasestorage.app",
  messagingSenderId: "397552928960",
  appId: "1:397552928960:web:e8e522c8ab844219204525"
});
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);

// ── 문항 정의 (표시 순서를 고정해야 분포가 뒤섞이지 않는다) ──────
const QS = [
  { k:"job", t:"직군", o:["직장인 (사무·관리·전문)","직장인 (현장·생산·서비스)","자영업·사업자","프리랜서","학생","무직·그 외"] },
  { k:"q1", t:"최근 한 달 저장 개수", o:["0~5개","6~20개","21~50개","51개 이상"] },
  { k:"q2", t:"그중 다시 꺼내 본 정도", o:["거의 없다","1~2개","절반쯤","대부분"] },
  { k:"q3", t:"못 찾아 재검색한 경험", core:1, o:["없다","가끔 (월 1~2회)","자주 (월 3회 이상)"] },
  { k:"q4", t:"저장처 개수", core:1, o:["1곳","2~3곳","4~5곳","6곳 이상"] },
  { k:"q5", t:"사용 의향 (5점)", core:1, o:[1,2,3,4,5] },
  { k:"q6", t:"지불 의사", core:1, o:["0원","~2천원","~5천원","~1만원","그 이상"] },
  { k:"source", t:"유입 채널" }
];
const OFFICE = "직장인 (사무·관리·전문)";
const pct = (n,d) => d ? Math.round(n/d*100) : 0;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

function render(rows) {
  const N = rows.length;
  $("N").textContent = N;
  $("goalFill").style.width = Math.min(100, N/20*100) + "%";
  $("goalNow").textContent = N + " / 20명";

  if (!N) {
    $("charts").innerHTML = '<div class="card"><div class="empty">아직 응답이 없습니다.<br>링크를 공유하면 여기에 실시간으로 쌓입니다.</div></div>';
    $("tiles").innerHTML = ""; $("cmp").innerHTML = ""; $("sentence").textContent = "—";
    return;
  }

  // 지표 타일
  const 재검색 = rows.filter(r => r.q3 !== "없다").length;
  const 분산   = rows.filter(r => r.q4 !== "1곳").length;
  const 지불   = rows.filter(r => r.q6 !== "0원").length;
  const 평균   = (rows.reduce((s,r) => s + (+r.q5||0), 0) / N).toFixed(1);
  const 메일   = rows.filter(r => (r.email||"").includes("@"));
  $("tiles").innerHTML = [
    [pct(재검색,N)+"%", "저장한 걸 못 찾아 재검색한 경험", 재검색+"명 / "+N+"명"],
    [pct(분산,N)+"%",   "자료를 2곳 이상에 분산 저장", 분산+"명 / "+N+"명"],
    [평균+"점",         "사용 의향 (5점 만점)", "4점 이상 "+rows.filter(r=>+r.q5>=4).length+"명"],
    [pct(지불,N)+"%",   "유료 지불 의사 있음", 지불+"명 / "+N+"명"]
  ].map(([v,k,d]) => `<div class="tile"><div class="v">${v}</div><div class="k">${k}</div><div class="d">${d}</div></div>`).join("");

  // 문항별 분포 — 단일 계열이므로 색은 크기만 나타내고 정체성은 라벨이 담당한다
  $("charts").innerHTML = QS.map(q => {
    const opts = q.o || [...new Set(rows.map(r => r[q.k]))].sort();
    const bars = opts.map(o => {
      const c = rows.filter(r => String(r[q.k]) === String(o)).length;
      return `<div class="row">
        <div class="rt"><span class="lb">${esc(o)}</span><span class="vl">${c}명<span>${pct(c,N)}%</span></span></div>
        <div class="bar"><i style="width:${pct(c,N)}%"></i></div></div>`;
    }).join("");
    return `<div class="card"><h2>${q.t}${q.core?'<span class="tag">핵심</span>':""}</h2>${bars}</div>`;
  }).join("");

  // 직군 교차검증
  const A = rows.filter(r => r.job === OFFICE), B = rows.filter(r => r.job !== OFFICE);
  const Ar = A.filter(r => r.q3 !== "없다").length, Br = B.filter(r => r.q3 !== "없다").length;
  $("cmp").innerHTML =
    `<div><div class="p">${pct(Ar,A.length)}%</div><div class="t">사무·전문직<br>${Ar}/${A.length}명</div></div>
     <div><div class="p">${pct(Br,B.length)}%</div><div class="t">그 외 직군<br>${Br}/${B.length}명</div></div>`;

  // 중복 의심 — 답변이 완전히 같고 5분 이내 재제출
  const sig = r => [r.job,r.q1,r.q2,r.q3,r.q4,r.q5,r.q6,r.reason,r.email].join("|");
  const g = {}; rows.forEach(r => (g[sig(r)] = g[sig(r)] || []).push(r));
  const dup = Object.values(g).filter(x => x.length > 1 && (() => {
    const t = x.map(r => +new Date(r.createdAt)).sort((a,b)=>a-b);
    return t.some((v,i) => i && v - t[i-1] < 3e5);
  })());
  $("dupWarn").innerHTML = dup.length
    ? `<div class="warn"><b>중복 의심 ${dup.length}건</b><br>답변이 완전히 같고 5분 이내에 다시 제출됐습니다. 우연히 같은 답일 수도 있어 자동 삭제하지 않았습니다 — 확인 후 Firebase 콘솔에서 지워주세요.</div>` : "";

  // 부정 의견
  const neg = rows.filter(r => (r.reason||"").trim().length > 1);
  $("quotesCard").hidden = !neg.length;
  $("quotes").innerHTML = neg.map(r =>
    `<div class="quote"><div class="m">${esc(r.job)} · 의향 ${r.q5}점</div>“${esc(r.reason)}”</div>`).join("");

  // 신청서 문장
  $("sentence").textContent =
`가설을 확인하기 위해 2026년 9월 ${N}명을 대상으로 설문을 진행했습니다.
${N}명 중 ${재검색}명(${pct(재검색,N)}%)이 저장해 둔 자료를 찾지 못해 처음부터 다시 검색한 경험이 있다고 답했고, ${분산}명(${pct(분산,N)}%)은 자료를 두 곳 이상에 나눠 저장하고 있었습니다.
사무·전문직(${A.length}명)에서 ${pct(Ar,A.length)}%, 그 외 직군(${B.length}명)에서 ${pct(Br,B.length)}%로 유사한 비율이 나타나, 이 문제가 특정 직군에 한정되지 않음을 확인했습니다.
제안한 해결 방식에 대한 사용 의향은 5점 만점에 평균 ${평균}점이었으며, ${지불}명(${pct(지불,N)}%)이 유료 지불 의사를 밝혔습니다. 응답자 중 ${메일.length}명은 출시 알림을 자발적으로 신청했습니다.`
+ (neg.length ? `\n다만 ${neg.length}명은 "${neg[0].reason}"과 같이 필요성을 느끼지 못한다고 답했으며, 해당 의견을 반영해 검증을 이어갈 계획입니다.` : "");

  // 이메일
  $("mailCard").hidden = !메일.length;
  $("mailSum").textContent = `출시 알림 신청 이메일 ${메일.length}건`;
  $("mails").textContent = 메일.map(r => r.email).join("\n");

  window.__rows = rows;
}

const copy = async (text, btn, done) => {
  try {
    await navigator.clipboard.writeText(text);
    const p = btn.textContent; btn.textContent = done;
    setTimeout(() => btn.textContent = p, 1800);
  } catch (e) { prompt("복사해 주세요", text); }
};
$("copyBtn").addEventListener("click", e => copy($("sentence").textContent, e.target, "복사됐어요 ✓"));
$("mailCopy").addEventListener("click", e => copy($("mails").textContent, e.target, "복사됐어요 ✓"));

$("csvBtn").addEventListener("click", () => {
  const rows = window.__rows || [];
  const cols = ["createdAt","job","q1","q2","q3","q4","q5","q6","reason","email","source"];
  const csv = "﻿" + [cols.join(",")].concat(
    rows.map(r => cols.map(c => `"${String(r[c] ?? "").replace(/"/g,'""')}"`).join(","))
  ).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type:"text/csv" }));
  a.download = `mynexus_survey_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
});

$("loginBtn").addEventListener("click", async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { $("gateMsg").textContent = "로그인에 실패했습니다. 다시 시도해 주세요."; }
});
$("logout").addEventListener("click", e => { e.preventDefault(); signOut(auth); });

let unsub = null;
onAuthStateChanged(auth, user => {
  if (unsub) { unsub(); unsub = null; }
  if (!user) { $("gate").hidden = false; $("app").hidden = true; return; }
  $("who").textContent = user.email;
  $("gate").hidden = true; $("app").hidden = false;
  unsub = onSnapshot(collection(db, "survey_responses"),
    snap => {
      const rows = snap.docs.map(d => d.data())
        .filter(r => !(r.reason || "").includes("TEST_DELETE_ME"))
        .sort((a,b) => String(a.createdAt).localeCompare(String(b.createdAt)));
      render(rows.map(r => ({ ...r, createdAt: r.createdAt?.toDate?.()?.toISOString() ?? "" })));
    },
    () => {
      $("gate").hidden = false; $("app").hidden = true;
      $("gateMsg").textContent = "이 계정은 열람 권한이 없습니다.";
      signOut(auth);
    });
});
</script>
</body>
</html>
