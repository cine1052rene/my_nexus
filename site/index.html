<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MyNexus — 나만의 링크·일정 허브</title>
<meta name="description" content="MyNexus는 링크·클립을 정리하고 일정을 관리하는 개인 허브 앱입니다." />
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(160deg, #f6f1fb 0%, #ffffff 55%);
    color: #24202b;
    min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 64px 24px 80px; }
  .logo {
    width: 84px; height: 84px; border-radius: 22px;
    background: linear-gradient(135deg, #6C2780, #8a3fa8);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 34px; font-weight: 800;
    margin: 0 auto 24px;
    box-shadow: 0 12px 30px rgba(108,39,128,0.25);
  }
  h1 { text-align: center; font-size: 28px; margin: 0 0 8px; font-weight: 800; }
  .tagline { text-align: center; color: #6b6575; font-size: 15px; margin: 0 0 40px; }
  .card {
    background: #fff; border-radius: 20px; padding: 28px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    margin-bottom: 20px;
  }
  .card h2 { font-size: 16px; margin: 0 0 10px; font-weight: 700; }
  .card p { font-size: 14px; line-height: 1.7; color: #4c4756; margin: 0; }
  .features { display: grid; gap: 14px; margin: 32px 0; }
  .feature { display: flex; gap: 14px; align-items: flex-start; }
  .feature .emoji { font-size: 22px; line-height: 1; }
  .feature .txt strong { display: block; font-size: 15px; margin-bottom: 2px; }
  .feature .txt span { font-size: 13px; color: #6b6575; }
  .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 40px; }
  .links a {
    display: inline-block; padding: 10px 18px; border-radius: 100px;
    font-size: 13px; font-weight: 600; text-decoration: none;
    color: #6C2780; background: #f1e6f7; transition: background 0.15s;
  }
  .links a:hover { background: #e6d3ef; }
  footer { text-align: center; margin-top: 56px; font-size: 12px; color: #9b95a5; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">N</div>
    <h1>MyNexus</h1>
    <p class="tagline">링크를 모으고, 정리하고, 다시 찾는 나만의 허브</p>

    <div class="features">
      <div class="feature">
        <div class="emoji">🔗</div>
        <div class="txt"><strong>DB 허브</strong><span>흩어진 링크를 한곳에 모으고 자동으로 분류합니다</span></div>
      </div>
      <div class="feature">
        <div class="emoji">🎬</div>
        <div class="txt"><strong>마이룸</strong><span>영상·클립을 태그로 정리해 다시 꺼내보기 쉽게</span></div>
      </div>
      <div class="feature">
        <div class="emoji">📅</div>
        <div class="txt"><strong>스케줄</strong><span>일정을 한눈에 확인하고 관리</span></div>
      </div>
      <div class="feature">
        <div class="emoji">🤖</div>
        <div class="txt"><strong>AI 챗봇</strong><span>내 데이터를 물어보면 바로 찾아드립니다</span></div>
      </div>
    </div>

    <div class="links">
      <a href="/privacy">개인정보처리방침</a>
      <a href="/delete-account">계정 삭제</a>
      <a href="mailto:cine1052rene@gmail.com">문의하기</a>
    </div>

    <footer>MyNexus by Emerald Works · cine1052rene@gmail.com</footer>
  </div>
</body>
</html>
