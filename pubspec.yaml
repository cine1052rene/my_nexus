name: my_nexus
description: "나만의 비서 앱 — 링크허브 + 스케줄 달력"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.3

  # Firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.9

  # Google Sign-In
  google_sign_in: ^6.2.2

  # Calendar (removed table_calendar - web incompatibility)

  # Network / URL
  url_launcher: ^6.3.1
  http: ^1.2.2
  cached_network_image: ^3.4.1

  # Gemini AI
  google_generative_ai: ^0.4.6
  cloud_functions: ^5.1.3
  shared_preferences: ^2.3.0

  # Email (IMAP for external mail — mobile only)
  enough_mail: ^2.1.3

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# 앱 아이콘 생성 설정 — 변경 후 `dart run flutter_launcher_icons` 실행
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  # 적응형 아이콘: 단색 배경 + 마크만 있는 전경 (시스템이 그림자를 따로 얹으므로 전경엔 그림자 없음)
  adaptive_icon_background: "#6C2780"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
