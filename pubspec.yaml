name: my_nexus
description: "나만의 비서 앱 — 링크허브 + 스케줄 달력"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.3

  # Firebase
  firebase_core: ^3.13.1
  cloud_firestore: ^5.6.9

  # Calendar (removed table_calendar - web incompatibility)

  # Network / URL
  url_launcher: ^6.3.1
  http: ^1.2.2
  cached_network_image: ^3.4.1

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
